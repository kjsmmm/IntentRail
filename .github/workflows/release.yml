name: GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify tag matches the product version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(python -c 'from intentrail_core.constants import PRODUCT_VERSION; print(PRODUCT_VERSION)')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Run checks and build release assets
        run: python tools/check.py --release-output dist
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
      - name: Preserve workflow-dispatch artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: intentrail-release-candidate
          path: dist/
          if-no-files-found: error
